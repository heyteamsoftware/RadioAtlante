<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Radio Atlante</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css?v=6">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<main class="content">

  <section class="live-card" id="liveCard">
    <div class="live-card-top">
      <div class="live-badge" id="liveBadge">
        <span class="live-dot"></span> <span class="live-badge-text">EMITIENDO 24H</span>
      </div>
      <img src="assets/img/logo.png" alt="Radio Atlante" class="brand-logo">
    </div>
    <p class="live-now-playing" id="liveNowPlaying" hidden>
      <img id="liveNowPlayingCover" class="live-now-playing-cover" src="assets/img/default-cover.svg" alt="">
      <span class="live-now-playing-text">
        <span id="liveNowPlayingTitle"></span>
        <span id="liveNowPlayingTime" class="live-now-playing-time"></span>
      </span>
    </p>
    <p class="live-sub" id="liveListeners">Conectando…</p>
    <button class="btn-live" id="btnLive" aria-label="Escuchar emisión">
      <svg id="btnLiveIconPlay" viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <span id="btnLiveSpinner" class="btn-live-spinner" hidden></span>
      <svg id="btnLiveIconPause" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      <span id="btnLiveLabel">Escuchar emisión</span>
    </button>
  </section>

  <section class="programs-section">
    <div class="section-header">
      <h2>Programas</h2>
      <input type="search" id="searchInput" placeholder="Buscar programa..." class="search-input">
    </div>
    <div id="categoryFilters" class="category-filters"></div>
    <div id="programsGrid" class="programs-list">
      <p class="loading">Cargando programas…</p>
    </div>
  </section>

  <div class="visitor-counter" id="visitorCounter" title="Visitantes únicos" aria-label="Visitantes únicos">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/></svg>
    <span id="visitorCount">—</span>
  </div>

</main>

<!-- Reproductor persistente -->
<footer class="player-bar" id="playerBar" hidden>
  <img id="playerCover" class="player-cover" src="assets/img/default-cover.svg" alt="">
  <div class="player-info">
    <div class="player-title" id="playerTitle">—</div>
    <div class="player-subtitle" id="playerSubtitle">—</div>
  </div>
  <div class="player-controls">
    <button id="playerToggle" class="player-toggle" aria-label="Reproducir/Pausar">
      <svg id="iconPlay" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
  </div>
  <div class="player-progress">
    <span id="timeCurrent">0:00</span>
    <input type="range" id="seekBar" min="0" max="100" value="0" class="seek-bar">
    <span id="timeDuration">0:00</span>
  </div>
</footer>

<audio id="audioPlayer" preload="none"></audio>

<script src="assets/js/app.js?v=5"></script>
</body>
</html>
